# Compose de PRODUÇÃO e STAGING (LW.3.7 e LW.3.7b). O de desenvolvimento (`docker-compose.yml`) não muda.
#
# O mesmo arquivo sobe os dois ambientes no mesmo VPS, como projetos separados do Compose, cada um com
# o próprio `.env`, banco, Redis, volumes e segredos (nada compartilhado):
#
#   docker network create selucra-edge          # uma vez por servidor
#   docker compose -p selucra-prod    --env-file /opt/selucra/prod.env    -f docker-compose.prod.yml up -d
#   docker compose -p selucra-staging --env-file /opt/selucra/staging.env -f docker-compose.prod.yml up -d
#   docker compose -p selucra-edge    --env-file /opt/selucra/prod.env    -f docker-compose.edge.yml up -d
#
# Modelos dos dois `.env` em `infra/env/`. O Caddy (`docker-compose.edge.yml`) é um projeto à parte que atende
# os dois ambientes, escolhendo o destino pelo nome do host (ver `infra/caddy/Caddyfile`); assim derrubar ou
# trocar o staging nunca mexe na porta de entrada de produção.
#
# Regras deste arquivo:
# - Nada publicado ao host além do Caddy (80/443). Postgres, Redis, motor e backend ficam em rede
#   interna. O motor não tem autenticação (`POST /admin/tick`): só é seguro porque ninguém de fora o alcança.
# - Variável obrigatória usa `${VAR:?}` e NUNCA tem valor padrão (o contrário do compose de dev). Só limites
#   de recursos têm padrão (o de produção); o staging reduz no próprio `.env`.
# - Imagens vêm do registro por tag (`IMAGE_TAG`, o SHA do commit, LW.3.13): o servidor só faz `pull`, nunca compila.
# - Backend e motor são singletons (agendadores em processo, limite de taxa em memória): nunca mais de uma réplica.
# - Senhas e URLs sem caracteres especiais (`openssl rand -hex 24`): elas entram em URLs de conexão.

x-hardening: &hardening
  restart: unless-stopped
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  pids_limit: 256
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  postgres:
    <<: *hardening
    image: postgres:16.14-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-selucra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD (openssl rand -hex 24)}
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?defina DB_OWNER_PASSWORD (openssl rand -hex 24)}
      GAMIFICATION_APP_PASSWORD: ${GAMIFICATION_APP_PASSWORD:?defina GAMIFICATION_APP_PASSWORD (openssl rand -hex 24)}
      MARKET_APP_PASSWORD: ${MARKET_APP_PASSWORD:?defina MARKET_APP_PASSWORD (openssl rand -hex 24)}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Papéis sem superusuário e os dois bancos (LW.3.17). Só roda na primeira inicialização do volume.
      - ./infra/postgres/init-prod:/docker-entrypoint-initdb.d:ro
    # O entrypoint do Postgres troca de usuário e ajusta dono do diretório de dados.
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-selucra}"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: ${POSTGRES_MEM_LIMIT:-1024m}
    cpus: ${POSTGRES_CPUS:-1.5}
    shm_size: 128m

  # O Redis guarda só cache com validade (cotações, ranking, assinatura, série de preço): é
  # reconstruível, então sem persistência e sem volume. `allkeys-lru` com teto evita crescer sem fim.
  redis:
    <<: *hardening
    image: redis:7.4.9-alpine
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?defina REDIS_PASSWORD (openssl rand -hex 24)}
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - ${REDIS_MAXMEMORY:-192mb}
      - --maxmemory-policy
      - allkeys-lru
    read_only: true
    cap_add:
      - SETUID
      - SETGID
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    mem_limit: ${REDIS_MEM_LIMIT:-256m}
    cpus: ${REDIS_CPUS:-0.5}

  engine:
    <<: *hardening
    image: ${REGISTRY_PREFIX:?defina REGISTRY_PREFIX (ex. ghcr.io/dono/selucra)}-engine:${IMAGE_TAG:?defina IMAGE_TAG (SHA do commit)}
    environment:
      ENGINE_ADDR: ":8080"
      # Papel de runtime só com DML (LW.3.17); as migrações usam o dono do schema.
      DATABASE_URL: postgres://market_app:${MARKET_APP_PASSWORD}@postgres:5432/market?sslmode=disable
      DATABASE_MIGRATE_URL: postgres://selucra_owner:${DB_OWNER_PASSWORD}@postgres:5432/market?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      # Imutável depois do primeiro dia em produção (RNF08: série determinística entre reinícios).
      SIMULATION_SEED: ${SIMULATION_SEED:?defina SIMULATION_SEED (fixo, nunca mude)}
      GOMEMLIMIT: ${ENGINE_GOMEMLIMIT:-400MiB}
    read_only: true
    tmpfs:
      - /tmp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [internal]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    mem_limit: ${ENGINE_MEM_LIMIT:-512m}
    cpus: ${ENGINE_CPUS:-1.0}

  backend:
    <<: *hardening
    image: ${REGISTRY_PREFIX}-backend:${IMAGE_TAG}
    environment:
      PORT: "3000"
      # `production` ou `staging` liga a guarda de configuração (LW.3.8): recusa subir com segredo de dev etc.
      DEPLOY_ENV: ${DEPLOY_ENV:?defina DEPLOY_ENV (production ou staging)}
      DATABASE_URL: postgres://gamification_app:${GAMIFICATION_APP_PASSWORD}@postgres:5432/gamification?sslmode=disable
      DATABASE_MIGRATE_URL: postgres://selucra_owner:${DB_OWNER_PASSWORD}@postgres:5432/gamification?sslmode=disable
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      ENGINE_URL: http://engine:8080
      # O Caddy é o único proxy que o backend enxerga e entrega o IP real (LW.3.9).
      TRUSTED_PROXY_HOPS: "1"
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (openssl rand -base64 48)}
      FRONTEND_URL: ${FRONTEND_URL:?defina FRONTEND_URL}
      PUBLIC_API_URL: ${PUBLIC_API_URL:?defina PUBLIC_API_URL}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:?defina EMAIL_PROVIDER (resend em produção; log só no staging)}
      RESEND_API_KEY_TRANSACTIONAL: ${RESEND_API_KEY_TRANSACTIONAL:-}
      RESEND_API_KEY_NEWS: ${RESEND_API_KEY_NEWS:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_FROM_TRANSACTIONAL: ${EMAIL_FROM_TRANSACTIONAL:-}
      EMAIL_FROM_NEWS: ${EMAIL_FROM_NEWS:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
      EMAIL_STREAK_REMINDER: ${EMAIL_STREAK_REMINDER:-}
      BILLING_PROVIDER: ${BILLING_PROVIDER:?defina BILLING_PROVIDER (revenuecat; dev é recusado)}
      BILLING_PRICE_MONTHLY_CENTS: ${BILLING_PRICE_MONTHLY_CENTS:-}
      BILLING_PRICE_ANNUAL_CENTS: ${BILLING_PRICE_ANNUAL_CENTS:-}
      REVENUECAT_SECRET_KEY: ${REVENUECAT_SECRET_KEY:-}
      REVENUECAT_WEBHOOK_AUTH: ${REVENUECAT_WEBHOOK_AUTH:-}
      REVENUECAT_ENTITLEMENT_ID: ${REVENUECAT_ENTITLEMENT_ID:-}
      AVATAR_STORAGE_DIR: /data/avatars
      NODE_OPTIONS: --max-old-space-size=${BACKEND_HEAP_MB:-384}
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      - avatar_data:/data/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_healthy
    networks:
      internal:
      # Rede com saída para a internet (RevenueCat, Resend, Google) e alcançável pelo Caddy, com apelido por
      # ambiente: o Caddy escolhe o destino por ele.
      edge:
        aliases:
          - ${BACKEND_ALIAS:?defina BACKEND_ALIAS (backend-prod ou backend-staging)}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    mem_limit: ${BACKEND_MEM_LIMIT:-768m}
    cpus: ${BACKEND_CPUS:-1.0}

  # Ferramentas de backup e restauração (LW.3.12). Não sobe com `up`: roda sob demanda
  # (`docker compose ... run --rm backup backup.sh`), pelos timers do systemd (`infra/systemd/`).
  backup:
    profiles: [tools]
    image: ${REGISTRY_PREFIX}-backup:${IMAGE_TAG}
    restart: "no"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 128
    environment:
      BACKUP_ENV_NAME: ${DEPLOY_ENV}
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER:-selucra}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      # Chaves PÚBLICAS do age (a privada principal fica fora do servidor, com o autor).
      AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      # Destino no rclone (ex. r2:selucra-backups). Vazio = só cópia local (não protege contra perda do servidor).
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_PROVIDER: Cloudflare
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      RCLONE_CONFIG_R2_ENDPOINT: ${R2_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACL: private
      # O token do R2 só escreve no bucket (não cria bucket).
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      HEALTHCHECK_URL: ${BACKUP_HEALTHCHECK_URL:-}
      RESTORE_TEST_HEALTHCHECK_URL: ${RESTORE_TEST_HEALTHCHECK_URL:-}
    volumes:
      - backup_data:/backups
      - avatar_data:/data/avatars
      # Entradas do host: o .env do servidor e a chave PRIVADA só de teste (ver runbook); /dev/null se ausentes.
      - ${APP_ENV_FILE:-/dev/null}:/backup-input/app.env:ro
      - ${BACKUP_TEST_IDENTITY_FILE:-/dev/null}:/backup-input/age-identity:ro
    tmpfs:
      - /work:size=2g,mode=1777
    networks: [internal, edge]
    mem_limit: 256m
    cpus: 0.5

networks:
  # Sem saída para a internet e sem acesso de fora: Postgres, Redis e motor vivem só aqui.
  internal:
    internal: true
  # Compartilhada entre produção, staging e Caddy: criada à mão uma vez (`docker network create selucra-edge`).
  edge:
    external: true
    name: selucra-edge

volumes:
  postgres_data:
  avatar_data:
  backup_data:
