services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tcc-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ./engine
    container_name: tcc-engine
    environment:
      ENGINE_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD:-tcc}@postgres:5432/market?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      # Seed fixa da simulação (Temporizador, tarefa 3.11) — RNF08 exige
      # série determinística mesmo entre reinícios, por isso nunca é
      # aleatória por processo.
      SIMULATION_SEED: ${SIMULATION_SEED:-42}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sem publicação de porta pro host: só o gateway é alcançável de fora
    # da rede do Compose (porta de entrada única do backend).
    expose:
      - "8080"

  backend:
    build:
      context: ./backend
    container_name: tcc-backend
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD:-tcc}@postgres:5432/gamification?sslmode=disable
      REDIS_URL: redis://redis:6379/1
      ENGINE_URL: http://engine:8080
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      # EM.1.2 (gateway de e-mail). `log` é o padrão de desenvolvimento: imprime o e-mail
      # (com os links) no log em vez de enviar. Em produção, EMAIL_PROVIDER=resend com chave e
      # remetente de um domínio verificado; nunca deixar `log` fora de desenvolvimento.
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-log}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_WEBHOOK_SECRET: ${RESEND_WEBHOOK_SECRET:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      EMAIL_REPLY_TO: ${EMAIL_REPLY_TO:-}
      EMAIL_SEND_RPS: ${EMAIL_SEND_RPS:-}
      EMAIL_OUTBOX_INTERVAL_MS: ${EMAIL_OUTBOX_INTERVAL_MS:-}
      # EM.6.1: link de cancelar inscrição dos e-mails opcionais. PUBLIC_API_URL é o endereço
      # público do gateway (o `List-Unsubscribe-Post` precisa de uma URL que aceite POST);
      # EMAIL_UNSUBSCRIBE_SECRET assina o token (vazio = usa o JWT_SECRET).
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:8000}
      EMAIL_UNSUBSCRIBE_SECRET: ${EMAIL_UNSUBSCRIBE_SECRET:-}
      # Tarefa 6.10.8 (upload de foto de perfil) — volume nomeado abaixo,
      # não bind mount: sobrevive a `docker compose down` sem `-v`, mesmo
      # tratamento de `postgres_data`/`redis_data`.
      AVATAR_STORAGE_DIR: /data/avatars
    volumes:
      - avatar_data:/data/avatars
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    expose:
      - "3000"

  gateway:
    build:
      context: ./gateway
    container_name: tcc-gateway
    depends_on:
      - backend
    ports:
      - "8000:80"

volumes:
  postgres_data:
  redis_data:
  avatar_data:
