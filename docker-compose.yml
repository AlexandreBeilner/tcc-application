services:
  postgres:
    image: postgres:16-alpine
    container_name: tcc-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tcc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tcc}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tcc}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: tcc-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  engine:
    build:
      context: ./engine
    container_name: tcc-engine
    environment:
      ENGINE_ADDR: ":8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD:-tcc}@postgres:5432/market?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Sem publicação de porta pro host: só o gateway é alcançável de fora
    # da rede do Compose (porta de entrada única do backend).
    expose:
      - "8080"

  backend:
    build:
      context: ./backend
    container_name: tcc-backend
    environment:
      PORT: "3000"
      DATABASE_URL: postgres://${POSTGRES_USER:-tcc}:${POSTGRES_PASSWORD:-tcc}@postgres:5432/gamification?sslmode=disable
      REDIS_URL: redis://redis:6379/1
      ENGINE_URL: http://engine:8080
      JWT_SECRET: ${JWT_SECRET:-dev-secret-troque-em-producao}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:8000/auth/google/callback}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      engine:
        condition: service_started
    expose:
      - "3000"

  gateway:
    build:
      context: ./gateway
    container_name: tcc-gateway
    depends_on:
      - backend
    ports:
      - "8000:80"

volumes:
  postgres_data:
  redis_data:
