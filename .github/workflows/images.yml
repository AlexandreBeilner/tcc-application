name: Imagens

# LW.3.13: constrói as imagens de produção no CI e publica no GHCR (ghcr.io, repositório privado)
# com o SHA do commit como tag. O servidor só faz `docker pull`, nunca compila. Nunca existe tag
# `latest`: o `deploy.sh` sempre pede um SHA, e voltar a versão é trocar o SHA.
#
# O gateway nginx não é publicado: em produção o Caddy (imagem oficial) ocupa o lugar dele (LW6).
# Os testes dos serviços rodam nos workflows próprios (backend-ci.yml, engine-ci.yml); o `deploy.sh`
# só promove um SHA cujo CI esteja verde.
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "engine/**"
      - ".github/workflows/images.yml"
  pull_request:
    paths:
      - "backend/**"
      - "engine/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  # Repositório do GitHub em minúsculas (o GHCR exige): ghcr.io/alexandrebeilner/selucra-<serviço>.
  IMAGE_PREFIX: ghcr.io/alexandrebeilner/selucra

jobs:
  build:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, engine]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v4

      - name: login no GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Em PR só constrói (valida o Dockerfile); em main/manual também publica.
      - name: build${{ github.event_name != 'pull_request' && ' e publica' || '' }}
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: ${{ github.event_name != 'pull_request' }}
          load: ${{ github.event_name == 'pull_request' }}
          tags: ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          # Liga o pacote privado ao repositório (herda o acesso dele).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      # Varredura de vulnerabilidade (Trivy, imagem oficial com versão fixa). Não bloqueia o merge no
      # início (LW.3.13): só relata HIGH/CRITICAL com correção disponível; passar a bloquear é decisão futura.
      - name: trivy
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            ghcr.io/aquasecurity/trivy:0.75.0 image \
            --severity HIGH,CRITICAL --ignore-unfixed --exit-code 0 \
            ${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }} || true
