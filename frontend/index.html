<!doctype html>
<html lang="pt-BR" data-theme="dark">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" href="/favicon.ico" sizes="any" />
        <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
        <link rel="manifest" href="/manifest.webmanifest" />
        <meta name="theme-color" content="#0e0f13" />
        <meta name="mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-title" content="Selucra" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black" />
        <meta name="format-detection" content="telephone=no" />
        <!-- Sem maximum-scale/user-scalable=no (WCAG 1.4.4): a pinça precisa funcionar. `viewport-fit=cover`
             deixa o app ocupar a tela toda no iPhone; a TopBar e a TabBar respeitam env(safe-area-inset-*). -->
        <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
        <!-- O app não é indexado: a vitrine de SEO é a landing em selucra.com.br (landing/). -->
        <meta name="robots" content="noindex, nofollow" />
        <title>Selucra</title>
    </head>
    <body>
        <div id="root"></div>
        <script type="module" src="/src/main.tsx"></script>
    </body>
</html>
