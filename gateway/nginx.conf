worker_processes auto;
events {}

http {
  # Porta de entrada única do backend (CLAUDE.md, spec seção 3):
  # frontend local → gateway → backend gamificado → motor de simulação.
  # Nenhum outro serviço de backend é exposto diretamente ao host.
  #
  # Este nginx serve o DESENVOLVIMENTO e o staging local. Em produção o Caddy ocupa o lugar dele
  # (decisão LW6); os mesmos limites abaixo viram o Caddyfile e as regras da Cloudflare (LW.3.7).
  server_tokens off;

  # Limites contra abuso (LW.3.10). Corpo pequeno por padrão; só o upload de avatar (multer: 5 MB)
  # recebe folga. Tempos curtos contra conexões lentas (slowloris) e backend pendurado.
  client_max_body_size 1m;
  client_header_timeout 10s;
  client_body_timeout 15s;
  send_timeout 30s;
  keepalive_timeout 30s;

  # Limitação de taxa grossa por IP nas rotas de autenticação, antes de chegar ao backend (que
  # tem a dele, por usuário/IP). Generosa de propósito: só freia script de força bruta, não gente
  # usando o app. Atrás do NAT do Docker o IP é o do gateway, então no desenvolvimento todos
  # compartilham o balde.
  limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/s;
  limit_req_status 429;

  server {
    listen 80;

    add_header X-Content-Type-Options "nosniff" always;

    location /auth/ {
      limit_req zone=auth burst=30 nodelay;
      include /etc/nginx/proxy_backend.conf;
    }

    # Upload de avatar: único corpo grande (5 MB no backend); 6m cobre o multipart.
    location = /me/avatar {
      client_max_body_size 6m;
      include /etc/nginx/proxy_backend.conf;
    }

    location / {
      include /etc/nginx/proxy_backend.conf;
    }
  }
}
